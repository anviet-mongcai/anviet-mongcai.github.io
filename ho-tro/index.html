<style>
  :root{--muc:#16181D;--nen:#EEF1F4;--the:#fff;--vien:#C9CFD8;--mo:#5B6372;--xanh:#12674A;--do:#A3231C;--vang:#FFF3BF;--r:14px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--nen);color:var(--muc);font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC",Arial,sans-serif;-webkit-text-size-adjust:100%}
  .hop{max-width:560px;margin:0 auto;padding:12px 16px 40px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
  header b{font-size:16px}
  .nn{display:flex;gap:4px}
  .nn button{border:1px solid var(--vien);background:#fff;border-radius:999px;padding:6px 10px;font-size:14px;color:var(--muc);min-height:36px}
  .nn button.chon{background:var(--muc);color:#fff;border-color:var(--muc)}
  .the{background:var(--the);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  h1{font-size:20px;margin:0 0 4px}
  h2{font-size:17px;margin:0 0 8px}
  .mo{color:var(--mo);font-size:14px}
  .lienhe{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .lienhe a,.lienhe button{display:flex;align-items:center;justify-content:center;min-height:48px;text-align:center;padding:8px;border-radius:10px;border:1px solid var(--vien);background:#fff;color:var(--muc);text-decoration:none;font-size:16px;font-weight:600}
  .lienhe a.goi{grid-column:1/-1;background:var(--xanh);border-color:var(--xanh);color:#fff;font-size:18px}
  .khan{background:var(--vang);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:12px}
  label.n{display:block;font-size:14px;color:var(--mo);margin:12px 0 4px}
  input.o,textarea{width:100%;font-size:17px;padding:12px;border:1px solid var(--vien);border-radius:10px;background:#fff;color:var(--muc);font-family:inherit}
  textarea{min-height:96px;resize:vertical}
  .hang{display:flex;gap:8px}
  .hang>div{flex:1}
  .loai{display:flex;flex-wrap:wrap;gap:6px}
  .loai button{min-height:44px;padding:0 12px;border-radius:10px;border:2px solid var(--vien);background:#fff;font-size:15px;color:var(--muc)}
  .loai button[aria-pressed=true]{background:var(--xanh);border-color:var(--xanh);color:#fff}
  .anh{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .anh img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--vien)}
  .phu{display:block;width:100%;min-height:48px;background:#fff;border:1px solid var(--vien);border-radius:10px;font-size:16px;color:var(--muc);margin-top:8px}
  .chinh{display:block;width:100%;margin-top:14px;padding:16px;font-size:18px;font-weight:700;border:0;border-radius:12px;background:var(--xanh);color:#fff}
  .chinh:disabled{background:#AEB5BF}
  .loi{color:var(--do);font-size:15px;margin-top:8px;min-height:1px}
  .ok{background:#E8F3EE;border-radius:10px;padding:12px;font-size:16px;margin-top:10px}
  .qd img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #E3E6EB;margin-top:6px;background:#FAFBFC;min-height:120px}
  .qd a{display:block;text-align:center;margin-top:6px;font-size:15px;color:var(--xanh)}
  .an{display:none!important}
</style>
</head>

      dgTieuDe: 'Review', dgGhi: 'Enjoyed your ride? A short Google review helps us a lot. Thank you!', dgNut: '⭐ Review on Google'
    },
    zh: {

      goi: '📞 拨打 +84 399 529 221', wechat: '微信：xedienmongcai1（点按复制）', daChep: '已复制微信号',
      khan: '<b>交通事故有人受伤：</b>请先拨打 <b>115</b>（急救）和 <b>113</b>（公安），再通知我们。',
      scTieuDe: '报告故障', scGhi: '车辆故障、没电、爆胎、碰撞……写几句话并拍照发送 — 我们会马上回电。',

      hdTieuDe: '车辆使用指南', hdGhi: '合同摘要，便于遵守 — 保存图片以便骑行时查看。', luu: '保存指南图片',

  };
  var qs = new URLSearchParams(location.search), NN = (qs.get('l') || (navigator.language || 'vi')).slice(0, 2).toLowerCase();
  if (!T[NN]) NN = 'vi';
  var S = { loai: '', anh: [], vt: '', dang: false };
  function $(id) { return document.getElementById(id); }
  function t(k) { return T[NN][k]; }
  function ve() {
    document.documentElement.lang = NN === 'zh' ? 'zh-CN' : NN;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.innerHTML = t(el.getAttribute('data-t')); });
    Array.prototype.forEach.call(document.querySelectorAll('.nn button'), function (b) { b.className = b.getAttribute('data-nn') === NN ? 'chon' : ''; });

  $('loai').onclick = function (ev) { var b = ev.target.closest('button[data-l]'); if (!b) return; S.loai = b.getAttribute('data-l'); ve(); };

  if (qs.get('hd')) $('hd').value = String(qs.get('hd')).replace(/[^\w\-]/g, '').slice(0, 30);

  /* ảnh: thu nhỏ trong máy (cạnh dài ≤ 1280, JPEG) — không lưu lại trong máy */
  $('themAnh').onclick = function () { if (S.anh.length < 3) $('tep').click(); };
  $('tep').onchange = function () {
    var f = this.files && this.files[0]; this.value = ''; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var c = Math.min(1, 1280 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * c); cv.height = Math.round(img.height * c);

        var q = 0.72, du = cv.toDataURL('image/jpeg', q);

      }, function () { S.dang = false; $('gui').disabled = false; $('gui').textContent = t('gui'); loi.textContent = t('E').mang; });
  };

})();
